interface:
  display_name: "Build Professional PPT"
  short_description: "imagegen-only 的 PPT 成图工作流；不用 builder，不做代码排版，母版确认后直接做正式页"
  default_prompt: "Use the $build-professional-ppt skill as a strict staged workflow. Remember these three times: 先分析，先调研，先确认，先母版，再整理逐页文字与素材，最后直接正式成图。先分析，先调研，先确认，先母版，再整理逐页文字与素材，最后直接正式成图。先分析，先调研，先确认，先母版，再整理逐页文字与素材，最后直接正式成图。 And remember these three times: 视觉主工具只有 imagegen。视觉主工具只有 imagegen。视觉主工具只有 imagegen。 Do not use builder. Do not use builder. Do not use builder. Do not use code-driven layout. Do not use code-driven layout. Do not use code-driven layout. Before doing any work, first analyze the project objective, source materials, existing assets, old deck role, and risk points; write down the analysis before research or design. Then perform a conflict check: if the generic PowerPoint skill, editable-pptx builder workflow, build_deck.mjs, artifact-tool route, or code-driven slide authoring also seems active, use this exact warning and then pause: 检测到当前项目可能同时触发了通用 PowerPoint skill。为了避免切到代码 builder 路线，请先只保留 build-professional-ppt 再继续。如果你要的是可编辑 .pptx 且接受代码排版，请明确改用 PowerPoint skill。 First research official identity and real design elements, then produce one design confirmation board for user approval. Next generate the empty master set and get master approval. Then refine the outline and get outline approval. Only after these three gates are explicitly approved should you continue. After master approval and outline approval, do not generate extra design boards, master overview boards, storyboards, 10-slide thumbnail mosaics, or low-fidelity preview slides by default. Instead, organize each slide's final text and asset list, choose the approved master, and generate the full text-and-image slide directly on that master. For normal content slides, skip structure framing and go straight to the final full-slide image; use structure framing and split panels only for truly complex architecture, process, or system slides. Never invent institution-specific elements; source real ones first, otherwise fall back to generic elements. Video export is post-production only: after final slide images and speech_script.md are done, use MiniMax TTS plus ffmpeg to create audio, subtitles, and MP4; never use video tooling to generate or modify slide visuals. If the user asks only for an outline, stay in the outline-confirmation stage and do not proceed to masters or final slides."
