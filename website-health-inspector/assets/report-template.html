<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --paper: #f4efe6;
      --paper-soft: #fffaf2;
      --ink: #25221d;
      --muted: #6d675f;
      --line: #d7c8b4;
      --brand: #193b5a;
      --brand-soft: #e7eef2;
      --accent: #2f6f6b;
      --healthy: #2f6f56;
      --warning: #b7791f;
      --critical: #a23b32;
      --ok-soft: #e8f3ed;
      --warn-soft: #fff2dc;
      --critical-soft: #f8e8e5;
      --info-soft: #e8f0f6;
      --unknown: #68707b;
      --shadow: 0 10px 30px rgba(69, 55, 38, .075);
      --font-sans: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
      --font-serif: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "SimSun", Georgia, serif;
      --font-mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(25,59,90,.055), transparent 260px),
        repeating-linear-gradient(90deg, rgba(114,91,57,.025) 0, rgba(114,91,57,.025) 1px, transparent 1px, transparent 72px),
        var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.62;
    }
    .page {
      width: min(1120px, calc(100% - 36px));
      margin: 0 auto;
      padding: 30px 0 52px;
    }
    .cover {
      min-height: 250px;
      border-bottom: 1px solid var(--line);
      border-top: 4px solid var(--brand);
      padding: 28px 0 24px;
      display: grid;
      align-content: center;
    }
    .eyebrow,
    .section-kicker {
      color: var(--brand);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
    }
    h1 {
      max-width: 820px;
      font-size: clamp(32px, 4.2vw, 48px);
      margin: 10px 0 14px;
      line-height: 1.12;
      font-weight: 650;
      letter-spacing: 0;
      font-family: var(--font-serif);
    }
    h2 {
      font-size: 23px;
      margin: 6px 0 12px;
      line-height: 1.25;
      color: var(--brand);
      letter-spacing: 0;
      font-family: var(--font-serif);
    }
    h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
      letter-spacing: 0;
      font-family: var(--font-serif);
    }
    p { margin: 0 0 12px; }
    .lead {
      max-width: 900px;
      font-size: 17px;
      color: #3a342b;
    }
    .status-line {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      align-items: center;
      margin-top: 18px;
      font-family: var(--font-sans);
    }
    .cover-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
      max-width: 900px;
    }
    .cover-meta-grid div {
      border-top: 1px solid rgba(216,204,185,.72);
      padding-top: 9px;
      min-width: 0;
    }
    .cover-meta-grid span {
      display: block;
      color: var(--muted);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .cover-meta-grid strong {
      color: var(--brand);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 52px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      padding: 4px 10px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .healthy { background: var(--healthy); }
    .warning { background: var(--warning); }
    .critical { background: var(--critical); }
    .unknown { background: var(--unknown); }
    .score {
      font-size: 30px;
      color: var(--brand);
      font-weight: 700;
      letter-spacing: 0;
    }
    .fine,
    .guide-footnote {
      color: var(--muted);
      font-family: var(--font-sans);
      font-size: 13px;
    }
    .guide-cover,
    .gpt-guide-section,
    .report-section,
    .summary-image-section {
      margin-top: 24px;
      padding: 22px 24px;
      background: rgba(255, 250, 242, .78);
      border: 1px solid rgba(216, 204, 185, .78);
      border-top: 3px solid rgba(25,59,90,.36);
      box-shadow: var(--shadow);
      border-radius: 6px;
    }
    .guide-cover {
      margin-top: 0;
      padding: 22px 24px 24px;
      border-top: 4px solid var(--brand);
      background:
        linear-gradient(90deg, rgba(47,111,107,.055), transparent 42%),
        rgba(255, 250, 242, .84);
    }
    .summary-image-section,
    .scope-section,
    .next-detection,
    .tech-appendix {
      box-shadow: none;
      background: rgba(255, 250, 242, .50);
    }
    .gpt-guide-section { border-top-color: rgba(47,111,107,.55); }
    .inspector-verdict { border-top-color: rgba(47,111,107,.72); }
    .auditor-summary { border-top-color: rgba(25,59,90,.72); }
    .executive-decision { border-top-color: rgba(47,111,107,.78); }
    .health-overview { border-top-color: rgba(183,121,31,.58); }
    .scope-section { border-top-color: rgba(116,109,98,.42); }
    .next-detection { border-top-color: rgba(47,111,107,.42); }
    .score-section { border-top-color: rgba(162,59,50,.48); }
    .browser-coverage { border-top-color: rgba(47,111,107,.55); }
    .system-health-section { border-top-color: rgba(183,121,31,.52); }
    .module-evidence { border-top-color: rgba(25,59,90,.52); }
    .tech-appendix { border-top-color: rgba(116,109,98,.38); }
    .management-brief { border-top-color: rgba(25,59,90,.62); }
    .root-cause-section { border-top-color: rgba(162,59,50,.44); }
    .retest-runbook { border-top-color: rgba(47,111,107,.50); }
    .term-notes,
    .evidence-file-index { border-top-color: rgba(116,109,98,.34); box-shadow: none; }
    .report-nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 76px repeat(8, minmax(0, 1fr));
      gap: 1px;
      margin-top: 14px;
      border: 1px solid rgba(216,204,185,.78);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(216,204,185,.78);
      box-shadow: 0 8px 20px rgba(69,55,38,.055);
    }
    .report-nav a {
      display: grid;
      gap: 2px;
      place-items: center;
      padding: 8px 6px;
      text-decoration: none;
      background: rgba(255,250,242,.92);
      color: var(--brand);
      font-family: var(--font-sans);
      min-width: 0;
      min-height: 34px;
    }
    .report-nav a.is-active,
    .report-nav a[aria-current="location"] {
      background: #fffdf8;
      color: var(--ink);
      box-shadow: inset 0 -3px 0 rgba(183,121,31,.78);
    }
    .report-nav a.is-active strong,
    .report-nav a[aria-current="location"] strong {
      color: var(--ink);
    }
    .report-nav a.is-active span,
    .report-nav a[aria-current="location"] span {
      color: var(--brand);
    }
    .toggle-all {
      min-width: 0;
      border: 0;
      background: rgba(25,59,90,.92);
      color: #fff;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 750;
      cursor: pointer;
      padding: 0 6px;
    }
    .report-nav strong {
      font-size: 12px;
      line-height: 1.25;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .report-nav span {
      display: none;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .guide-cover-head,
    .gpt-guide-intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, .62fr);
      gap: 18px;
      align-items: end;
      margin-top: 6px;
      margin-bottom: 14px;
    }
    .guide-cover-head {
      margin-top: 0;
      align-items: center;
    }
    .gpt-guide-intro p {
      max-width: 760px;
      color: #433c32;
      font-size: 15px;
    }
    .report-type {
      margin: -4px 0 12px;
      color: var(--brand);
      font-family: var(--font-sans);
      font-size: 18px;
      font-weight: 750;
      letter-spacing: 0;
    }
    .site-identity-strip {
      display: grid;
      grid-template-columns: minmax(260px, 1.4fr) minmax(150px, .75fr) minmax(180px, .9fr);
      gap: 1px;
      margin: 14px 0 16px;
      border: 1px solid rgba(25,59,90,.16);
      border-left: 4px solid rgba(47,111,107,.72);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(25,59,90,.14);
    }
    .site-identity-strip div {
      min-width: 0;
      padding: 9px 12px;
      background: rgba(231,238,242,.52);
      font-family: var(--font-sans);
    }
    .site-identity-strip span {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }
    .site-identity-strip strong {
      display: block;
      color: var(--brand);
      font-size: 14px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .next-action {
      border-left: 3px solid var(--brand);
      padding: 8px 11px;
      background: rgba(231,238,242,.72);
      font-family: var(--font-sans);
      font-size: 13px !important;
    }
    .guide-cover-meta {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      margin: 14px 0;
      border: 1px solid rgba(216,204,185,.78);
      border-radius: 6px;
      overflow: hidden;
      background: rgba(216,204,185,.78);
    }
    .guide-cover-meta div {
      min-width: 0;
      padding: 9px 11px;
      background: rgba(255,250,242,.78);
      font-family: var(--font-sans);
    }
    .guide-cover-meta span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .guide-cover-meta strong {
      display: block;
      color: var(--brand);
      font-size: 14px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }
    .guide-cover-meta .badge {
      width: fit-content;
    }
    .guide-cover-image,
    .gpt-guide-img {
      width: 100%;
      display: block;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(25, 59, 90, .08);
    }
    .guide-cover-image {
      margin-top: 10px;
    }
    .reading-path {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding: 11px 13px;
      background: rgba(231,238,242,.48);
      border: 1px solid rgba(25,59,90,.12);
      border-radius: 6px;
      font-family: var(--font-sans);
    }
    .reading-path span {
      color: var(--brand);
      font-weight: 700;
    }
    .reading-path ol {
      margin: 0;
      padding-left: 20px;
      color: #3f4850;
      line-height: 1.55;
    }
    .missing-guide {
      min-height: 280px;
      display: grid;
      place-items: center;
      gap: 8px;
      padding: 32px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.55);
      color: var(--muted);
      font-family: var(--font-sans);
    }
    .missing-guide strong {
      color: var(--brand);
      font-size: 18px;
    }
    .html-guide-visual {
      margin-top: 12px;
      padding: 16px;
      border: 1px solid rgba(25,59,90,.16);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255,250,242,.96), rgba(244,248,248,.92)),
        repeating-linear-gradient(90deg, rgba(25,59,90,.035) 0 1px, transparent 1px 42px);
      box-shadow: 0 8px 22px rgba(25, 59, 90, .08);
      font-family: var(--font-sans);
    }
    .html-guide-banner {
      display: grid;
      grid-template-columns: minmax(190px, .36fr) minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(216,204,185,.82);
    }
    .html-guide-banner span,
    .html-guide-module span,
    .html-guide-strength span,
    .html-guide-kpis span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .html-guide-banner strong {
      display: block;
      margin-top: 4px;
      color: var(--brand);
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 500;
    }
    .html-guide-banner p {
      margin: 0;
      color: #3f4850;
      line-height: 1.7;
    }
    .html-guide-kpis {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      margin-top: 12px;
      background: rgba(216,204,185,.78);
      border: 1px solid rgba(216,204,185,.78);
    }
    .html-guide-kpis div {
      min-width: 0;
      padding: 10px 12px;
      background: rgba(255,255,255,.58);
    }
    .html-guide-kpis strong {
      display: block;
      margin-top: 4px;
      color: var(--brand);
      font-size: 18px;
      overflow-wrap: anywhere;
    }
    .html-guide-flow {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }
    .html-guide-step {
      position: relative;
      min-width: 0;
      min-height: 116px;
      padding: 12px 11px 12px;
      border: 1px solid rgba(25,59,90,.14);
      border-top: 3px solid rgba(47,111,107,.55);
      border-radius: 7px;
      background: rgba(255,255,255,.62);
    }
    .html-guide-step:not(:last-child)::after {
      content: "";
      position: absolute;
      right: -8px;
      top: 48%;
      width: 8px;
      height: 1px;
      background: rgba(25,59,90,.28);
    }
    .html-guide-step span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 22px;
      margin-bottom: 9px;
      border-radius: 999px;
      background: rgba(25,59,90,.08);
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
    }
    .html-guide-step strong {
      display: block;
      color: var(--brand);
      font-size: 15px;
      margin-bottom: 6px;
    }
    .html-guide-step p {
      margin: 0;
      color: #586169;
      font-size: 12.5px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .html-guide-bottom {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, .82fr);
      gap: 10px;
      margin-top: 12px;
    }
    .html-guide-module,
    .html-guide-strength {
      border: 1px solid rgba(216,204,185,.78);
      border-radius: 7px;
      background: rgba(255,250,242,.68);
      padding: 12px;
    }
    .html-guide-module p {
      margin: 5px 0 0;
      color: #3f4850;
      line-height: 1.6;
    }
    .html-guide-strength {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      padding: 0;
      overflow: hidden;
    }
    .html-guide-strength div {
      min-width: 0;
      padding: 11px 10px;
      background: rgba(255,255,255,.5);
    }
    .html-guide-strength strong {
      display: block;
      margin-top: 4px;
      color: var(--brand);
      font-size: 19px;
    }
    .summary-img {
      width: 100%;
      max-width: 980px;
      border: 1px solid var(--line);
      display: block;
      margin-top: 12px;
      background: #fff;
      border-radius: 6px;
    }
    .report-section > .section-kicker,
    .gpt-guide-section > .section-kicker,
    .summary-image-section > .section-kicker {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .report-section > .section-kicker::before,
    .gpt-guide-section > .section-kicker::before,
    .summary-image-section > .section-kicker::before {
      content: "";
      width: 18px;
      height: 2px;
      background: currentColor;
      opacity: .55;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
      margin-top: 14px;
    }
    .metric {
      border-top: 0;
      border-left: 3px solid var(--brand);
      padding: 12px 12px;
      min-height: 78px;
      background: rgba(255,255,255,.42);
      border-right: 1px solid rgba(216,204,185,.82);
      border-bottom: 1px solid rgba(216,204,185,.82);
      border-left: 1px solid rgba(216,204,185,.82);
      border-radius: 5px;
    }
    .metric.healthy-tone { border-left-color: var(--healthy); }
    .metric.warning-tone { border-left-color: var(--warning); }
    .metric.critical-tone { border-left-color: var(--critical); }
    .metric .value {
      font-size: 28px;
      font-weight: 700;
      color: var(--brand);
      line-height: 1;
      letter-spacing: 0;
    }
    .metric .label {
      color: var(--muted);
      font-family: var(--font-sans);
      font-size: 12px;
      margin-top: 8px;
    }
    .health-overview h2 {
      margin-bottom: 8px;
    }
    .health-overview {
      background: rgba(251,247,239,.72);
      box-shadow: none;
    }
    .overview-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 128px;
      gap: 18px;
      align-items: start;
      border-bottom: 1px solid rgba(216,204,185,.88);
      padding-bottom: 14px;
    }
    .overview-head p {
      max-width: 860px;
      color: var(--muted);
      margin: 0;
      font-family: var(--font-sans);
      line-height: 1.65;
    }
    .overview-score-card {
      border-left: 1px solid rgba(25,59,90,.24);
      border-radius: 0;
      background: transparent;
      padding: 2px 0 2px 16px;
      text-align: left;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .overview-score-card span,
    .overview-score-card small {
      color: var(--muted);
      font-family: var(--font-sans);
      font-size: 13px;
    }
    .overview-score-card strong {
      color: var(--brand);
      font-size: 36px;
      line-height: 1;
      margin: 6px 0 2px;
      letter-spacing: 0;
    }
    .overview-metrics {
      grid-template-columns: repeat(6, minmax(0, 1fr));
      border-bottom: 1px solid rgba(216,204,185,.72);
      padding-bottom: 12px;
    }
    .health-picture-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
      border-bottom: 1px solid rgba(216,204,185,.72);
      padding-bottom: 14px;
    }
    .health-picture-card {
      border: 1px solid rgba(216,204,185,.82);
      border-left: 4px solid var(--brand);
      background: rgba(255,255,255,.34);
      border-radius: 6px;
      padding: 13px 14px;
    }
    .health-baseline-card { border-left-color: var(--healthy); }
    .attention-card { border-left-color: var(--warning); }
    .health-picture-card h3 {
      margin: 0 0 5px;
      color: var(--ink);
      font-size: 17px;
    }
    .health-picture-card p {
      margin: 0 0 10px;
      color: var(--muted);
      font-family: var(--font-sans);
      font-size: 12px;
      line-height: 1.55;
    }
    .compact-stat-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 12px;
      font-family: var(--font-sans);
    }
    .compact-stat-list div {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid rgba(216,204,185,.68);
      padding-top: 7px;
      min-width: 0;
    }
    .compact-stat-list span {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .compact-stat-list strong {
      color: var(--brand);
      font-size: 14px;
      white-space: nowrap;
    }
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 22px;
      margin-top: 14px;
    }
    .overview-panel {
      border: 0;
      border-top: 1px solid rgba(216,204,185,.70);
      border-radius: 0;
      background: transparent;
      padding: 14px 0 4px;
      min-height: 0;
    }
    .overview-panel h3 {
      margin: 0 0 12px;
      color: var(--ink);
      font-size: 18px;
    }
    .overview-panel ul,
    .overview-panel ol {
      margin: 0;
      padding-left: 20px;
      font-family: var(--font-sans);
      color: var(--ink);
      line-height: 1.7;
    }
    .overview-panel li {
      margin: 7px 0;
    }
    .overview-panel li strong {
      color: var(--brand);
      margin-right: 6px;
      white-space: nowrap;
    }
    .overview-panel li span {
      color: var(--muted);
    }
    .action-panel {
      background: transparent;
    }
    .auditor-summary {

<body>
  <main class="page">
    {{BODY}}
  </main>
  <script>
    (() => {
      const button = document.querySelector("[data-toggle-all]");
      const folds = Array.from(document.querySelectorAll("details.fold-section"));
      if (!button || !folds.length) return;
      const sync = () => {
        const allOpen = folds.every((item) => item.open);
        button.textContent = allOpen ? "收起全部" : "展开全部";
        button.setAttribute("aria-expanded", String(allOpen));
      };
      button.addEventListener("click", () => {
        const open = !folds.every((item) => item.open);
        folds.forEach((item) => { item.open = open; });
        sync();
      });
      folds.forEach((item) => item.addEventListener("toggle", sync));
      sync();
    })();
    (() => {
      const navLinks = Array.from(document.querySelectorAll('.report-nav a[href^="#"]'));
      if (!navLinks.length) return;
      const byId = new Map();
      navLinks.forEach((link) => {
        const id = decodeURIComponent(link.getAttribute("href").slice(1));
        const target = document.getElementById(id);
        if (target) byId.set(id, { link, target });
      });
      const setActive = (id) => {
        byId.forEach(({ link }, key) => {
          const active = key === id;
          link.classList.toggle("is-active", active);
          if (active) {
            link.setAttribute("aria-current", "location");
          } else {
            link.removeAttribute("aria-current");
          }
        });
      };
      const visible = new Map();
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          visible.set(entry.target.id, entry.isIntersecting ? entry.intersectionRatio : 0);
        });
        let bestId = "";
        let bestScore = 0;
        visible.forEach((score, id) => {
          if (score > bestScore) {
            bestScore = score;
            bestId = id;
          }
        });
        if (bestId) setActive(bestId);
      }, { rootMargin: "-18% 0px -64% 0px", threshold: [0, 0.15, 0.35, 0.6, 1] });
      byId.forEach(({ target }) => observer.observe(target));
      const first = navLinks[0].getAttribute("href").slice(1);
      if (first) setActive(decodeURIComponent(first));
    })();
    (() => {
      const buttons = Array.from(document.querySelectorAll("[data-copy-target]"));
      buttons.forEach((button) => {
        button.addEventListener("click", async () => {
          const key = button.getAttribute("data-copy-target");
          const source = document.querySelector(`[data-copy-source="${key}"]`);
          const text = source ? source.textContent.trim() : "";
          if (!text) return;
          try {
            await navigator.clipboard.writeText(text);
            button.textContent = "已复制";
            button.setAttribute("data-copied", "true");
            window.setTimeout(() => {
              button.textContent = "复制摘要";
              button.removeAttribute("data-copied");
            }, 1600);
          } catch (error) {
            button.textContent = "复制失败";
            window.setTimeout(() => { button.textContent = "复制摘要"; }, 1600);
          }
        });
      });
    })();
  </script>
</body>
